# ==============================================================================
# LEGAL OS – PRODUCTION REDIS CONFIGURATION
# ==============================================================================

# Network & Security
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Memory Management & Eviction
maxmemory 1536mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence (AOF for Job Queues + Snapshot for State)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging & Monitoring
loglevel notice
logfile ""
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 50

# Client Limits
maxclients 10000
