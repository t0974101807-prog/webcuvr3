apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-os-ai-agent
  namespace: legal-os-prod
  labels:
    app: legal-os
    tier: ai-agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: legal-os
      tier: ai-agent
  template:
    metadata:
      labels:
        app: legal-os
        tier: ai-agent
    spec:
      serviceAccountName: legal-os-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: legal-os-ai-agent
          image: asia-southeast1-docker.pkg.dev/legal-os-prod/app/legal-os-api:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: legal-os-config
          env:
            - name: AI_AGENT_DEDICATED_NODE
              value: "true"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: legal-os-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: legal-os-secrets
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi" # Hard limit: OOMKilled here will never impact legal-os-api
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: legal-os-ai-service
  namespace: legal-os-prod
  labels:
    app: legal-os
    tier: ai-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: legal-os
    tier: ai-agent
