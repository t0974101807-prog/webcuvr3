apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legal-os-network-policy
  namespace: legal-os-prod
  labels:
    app: legal-os
spec:
  podSelector:
    matchLabels:
      app: legal-os
      tier: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to port 3000 from Kubernetes Ingress Controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
    # Allow local prometheus scraper ports
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow egress to Core DNS for external service discovery (eg. Gemini, SQLite, Redis cluster)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to external HTTPS APIs (eg. Gemini API, Cloud Databases)
    - ports:
        - protocol: TCP
          port: 443
