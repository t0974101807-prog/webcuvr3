apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legal-os-hpa
  namespace: legal-os-prod
  labels:
    app: legal-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legal-os-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
