apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: legal-os-prod
  labels:
    app: legal-os
    tier: database
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: legal-os
      tier: database
  template:
    metadata:
      labels:
        app: legal-os
        tier: database
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "legal_os_db"
            - name: POSTGRES_USER
              value: "legal_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: legal-os-secrets
                  key: DATABASE_URL
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["psql", "-U", "legal_user", "-d", "legal_os_db", "-c", "SELECT 1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "legal_user", "-d", "legal_os_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "standard-rwo"
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: legal-os-prod
  labels:
    app: legal-os
    tier: database
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: legal-os
    tier: database
